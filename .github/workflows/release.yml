# Publishes a GitHub Release with the mod jar whenever main carries a version
# (from gradle.properties) that has not been released yet. To ship a new
# release, bump `version` and merge to main.

name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: read version
        id: version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: validate gradle wrapper
        if: steps.version.outputs.exists == 'false'
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        if: steps.version.outputs.exists == 'false'
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: publish release
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The *-sources.jar does not match this pattern, only the playable jar does.
          gh release create "v$VERSION" build/libs/*-"$VERSION".jar \
            --target "$GITHUB_SHA" \
            --title "$(basename "$GITHUB_REPOSITORY") $VERSION (Minecraft 1.21.11 Fabric)" \
            --generate-notes
